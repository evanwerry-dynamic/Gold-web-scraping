name: Enable GitHub Pages + Deploy Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/enable-pages.yml']

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  enable-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages-url.outputs.url }}
    steps:
      - name: Enable GitHub Pages (branch source)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Try POST (first-time enable)
          STATUS=$(curl -s -o /tmp/pages_resp.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')

          echo "POST status: $STATUS"
          cat /tmp/pages_resp.json

          # If already configured (409 or 422), update source via PUT
          if [ "$STATUS" = "409" ] || [ "$STATUS" = "422" ]; then
            curl -s -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/pages" \
              -d '{"source":{"branch":"gh-pages","path":"/"}}'
          fi

      - name: Get Pages URL
        id: pages-url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          URL=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages" | jq -r '.html_url // "pending"')
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Dashboard URL: $URL"
