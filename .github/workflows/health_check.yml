name: System Health Check

on:
  schedule:
    - cron: "0 */2 * * *"   # Every 2 hours
  workflow_dispatch:         # Manual trigger

jobs:
  # ── Unit tests ─────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (66 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install numpy scipy pytest python-dotenv websockets requests pydantic

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

  # ── Data integrity checks ───────────────────────────────────────────────────
  data-integrity:
    name: Data Integrity Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy scipy python-dotenv

      - name: Verify fair value model bounds
        run: |
          python - <<'EOF'
          from polymarket.fair_value import fair_value_binary, should_trade, dynamic_taker_fee

          # All probabilities must be in [0, 1]
          for delta_pct in [-5, -1, -0.1, 0, 0.1, 1, 5]:
              p = fair_value_binary(100 * (1 + delta_pct/100), 100.0, 0.0002, 10.0)
              assert 0.0 <= p <= 1.0, f"P={p} out of bounds for delta={delta_pct}%"

          # should_trade has no price floor — net edge after fee is the sole filter
          ok, _ = should_trade(0.71, 0.69)
          assert not ok, "Trade with thin edge at $0.69 should be blocked (fee kills edge)"

          # Fee peaks at $0.50 — dynamic fee formula correctness
          fee_50 = dynamic_taker_fee(0.50)
          assert abs(fee_50 - 0.018) < 1e-9, f"Fee at 0.50 should be 1.8%, got {fee_50}"

          print("✓ Fair value model: all checks passed")
          EOF

      - name: Verify resolution logic symmetry
        run: |
          python - <<'EOF'
          # UP wins if BTC went up, DOWN wins if BTC went down
          # Tested by deep-dive audit — confirmed symmetric
          def resolve(side, btc_went_up):
              return (side in ("UP", "YES")) == btc_went_up

          assert resolve("UP",   True)  is True,  "UP+BTC_UP should win"
          assert resolve("UP",   False) is False,  "UP+BTC_DOWN should lose"
          assert resolve("DOWN", False) is True,   "DOWN+BTC_DOWN should win"
          assert resolve("DOWN", True)  is False,  "DOWN+BTC_UP should lose"
          assert resolve("YES",  True)  is True,   "YES same as UP"
          assert resolve("NO",   False) is True,   "NO same as DOWN"

          print("✓ Resolution logic: symmetric UP/DOWN confirmed")
          EOF

      - name: Verify risk circuit breakers are wired
        run: |
          python - <<'EOF'
          import ast, sys

          # Confirm on_trade_result is called in redeem_loop
          # (This was the bug found in the deep-dive audit)
          src = open("polymarket/execution/redeem.py").read()
          assert "on_trade_result" in src, \
              "CRITICAL: on_trade_result not called in redeem_loop — loss streak circuit breakers are dead"

          # Confirm risk_mgr is passed into redeem_loop from main
          main_src = open("polymarket/main.py").read()
          assert "redeem_loop(oracle, risk_mgr)" in main_src, \
              "CRITICAL: redeem_loop called without risk_mgr in main.py"

          print("✓ Risk circuit breakers: on_trade_result wired into redeem_loop")
          EOF

      - name: Verify loss recording path
        run: |
          python - <<'EOF'
          # Confirm losses write negative pnl to trade history
          src = open("polymarket/execution/redeem.py").read()
          assert '"pnl": final_pnl' in src, "pnl field must be written to redeem record"
          assert "payout - pos.cost_basis" in src, "final_pnl formula must be payout - cost_basis"

          # If resolution=0 (loss): payout=0, final_pnl = 0 - cost_basis = negative ✓
          # If resolution=1 (win):  payout=shares, final_pnl = shares - cost_basis = positive ✓
          cost_basis = 100.0
          shares = 100.0 / 0.85  # e.g. entry at $0.85

          loss_pnl = 0 * shares - cost_basis  # resolution=0
          win_pnl  = 1.0 * shares - cost_basis  # resolution=1

          assert loss_pnl < 0, f"Loss should be negative, got {loss_pnl}"
          assert win_pnl > 0,  f"Win should be positive, got {win_pnl}"

          print(f"✓ Loss recording: loss={loss_pnl:.2f}, win={win_pnl:.2f}")
          EOF

      - name: Verify TypeScript build is clean
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: polymarket/dashboard/frontend/package-lock.json

      - name: TS check
        working-directory: polymarket/dashboard/frontend
        run: |
          npm ci --silent
          npx tsc --noEmit

  # ── Live Railway health ping ────────────────────────────────────────────────
  live-health:
    name: Railway Health Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health endpoint and verify schema
        run: |
          curl -sf --max-time 10 \
            https://gold-web-scraping-production.up.railway.app/health \
            | python3 - <<'EOF'
          import sys, json
          data = json.load(sys.stdin)
          assert "status"  in data, "Missing 'status' field"
          assert "clients" in data, "Missing 'clients' field"
          assert data["status"] == "ok", \
              f"Railway health check returned status={data['status']} (expected ok)"
          print(f"✓ Health OK — {data['clients']} WS client(s) connected")
          EOF
