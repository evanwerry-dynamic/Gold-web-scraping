name: Deploy Dashboard → GitHub Pages

on:
  push:
    branches: ["main", "claude/twitter-post-feasibility-7gYpb"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: polymarket/dashboard/frontend/package-lock.json

      - name: Install dependencies
        working-directory: polymarket/dashboard/frontend
        run: npm ci

      - name: Build (static export)
        working-directory: polymarket/dashboard/frontend
        env:
          PAGES_BUILD: "true"
          NEXT_PUBLIC_WS_URL: "wss://gold-web-scraping-production.up.railway.app/ws"
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: polymarket/dashboard/frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
