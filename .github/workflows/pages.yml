name: Deploy Dashboard → GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: polymarket/dashboard/frontend/package-lock.json

      - name: Install dependencies
        working-directory: polymarket/dashboard/frontend
        run: npm ci

      - name: Build (static export)
        working-directory: polymarket/dashboard/frontend
        env:
          PAGES_BUILD: "true"
          NEXT_PUBLIC_WS_URL: "wss://gold-web-scraping-production.up.railway.app/ws"
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: polymarket/dashboard/frontend/out
          force_orphan: true
