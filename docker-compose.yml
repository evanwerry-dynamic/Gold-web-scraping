services:

  # ── Python trading bot + FastAPI WebSocket bridge ─────────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./polymarket/state:/app/polymarket/state
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Next.js dashboard ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./polymarket/dashboard/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      bot:
        condition: service_healthy

  # ── Nginx reverse proxy (port 80 → both services) ─────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - bot
      - frontend
    restart: unless-stopped
